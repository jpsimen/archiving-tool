[project]
name = "archiving-tool"
version = "0.1.0"
description = "A reliable command-line tool for archiving private data collections with integrity verification"
readme = "README.md"
authors = [
    { name = "Jan-Philipp Simen" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.3.1",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
archiving-tool = "archiving_tool:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
